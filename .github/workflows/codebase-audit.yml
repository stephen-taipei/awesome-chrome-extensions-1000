name: Codebase Audit

on:
  push:
    branches: [main, dev, audit/chrome-extensions-20260924]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codebase-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate every package and the committed inventory
        run: |
          mkdir -p .audit-results
          python scripts/audit.py --json .audit-results/extension-status.json
          cmp docs/extension-status.json .audit-results/extension-status.json
          node --experimental-vm-modules scripts/check-syntax.mjs > .audit-results/syntax.json
          python scripts/repair_legacy.py --json .audit-results/migration-dry-run.json
      - name: Run security, lifecycle, timing and audit regression tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py' 2>&1 | tee .audit-results/python-tests.txt
          node --test tests/*.test.mjs | tee .audit-results/node-tests.txt
      - name: Install browser test dependency
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Test native unpacked-extension CSP and interactions
        run: python tests/browser_smoke.py --native --json .audit-results/browser-results.json
      - name: Record tested source revision
        if: always()
        run: git rev-parse HEAD > .audit-results/tested-commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: codebase-audit-evidence
          include-hidden-files: true
          path: .audit-results/
          retention-days: 7
          if-no-files-found: error
