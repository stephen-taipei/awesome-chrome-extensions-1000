name: Codebase Audit

on:
  push:
    branches: [audit/chrome-extensions-20260924]
    paths: [.github/workflows/codebase-audit.yml, '.audit-inputs/**']

permissions:
  contents: write

concurrency:
  group: chrome-audit-repairs
  cancel-in-progress: false

jobs:
  audit:
    if: github.ref == 'refs/heads/audit/chrome-extensions-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/chrome-extensions-20260924
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Materialize verified repair inputs on the audit branch only
        run: |
          python - <<'PY'
          import hashlib, io, tarfile
          from pathlib import Path
          data = b''.join((Path('.audit-inputs') / str(i)).read_bytes() for i in range(5))
          assert hashlib.sha256(data).hexdigest() == 'b81e524604d466a6c2f9755fffc5ae65425e9a10391b5cbf14a5be304c1d41fa'
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as archive:
              for member in archive.getmembers():
                  path = Path(member.name)
                  assert member.isfile() and not path.is_absolute() and '..' not in path.parts
                  assert path.parts[0] in {'scripts', 'tests', 'docs', 'shared', 'extensions', '.gitignore', '.audit-readme.patch'}
              archive.extractall('.', filter='data')
          PY
          git apply .audit-readme.patch
          rm .audit-readme.patch
          mkdir -p .audit-results
          python scripts/repair_legacy.py --apply --json .audit-results/repairs.json
          python scripts/audit.py --json docs/extension-status.json
          node --experimental-vm-modules scripts/check-syntax.mjs > .audit-results/syntax.json
          python -m unittest discover -s tests -p 'test_*.py'
          node --test tests/*.test.mjs | tee .audit-results/unit-tests.txt
          git diff --exit-code -- index.html
      - name: Commit reviewed source repairs, preserving the homepage
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .gitignore README.md scripts tests docs shared extensions
          if ! git diff --cached --quiet; then
            git commit -m 'fix: harden extension packages, repair resources and add regression gates'
            git push origin HEAD:audit/chrome-extensions-20260924
          fi
          git rev-parse HEAD | tee .audit-results/tested-commit.txt
          git archive --format=tar HEAD -o /tmp/repaired-source.tar
      - name: Install browser test dependency
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Native unpacked-extension CSP and interaction regression tests
        run: python tests/browser_smoke.py --native --json .audit-results/browser-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-repair-evidence
          include-hidden-files: true
          path: |
            .audit-results/
            docs/extension-status.json
            /tmp/repaired-source.tar
          retention-days: 7
          if-no-files-found: warn
