name: Notify Parent Repo

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger stephen.taipei deployment
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GH_PAT }}
          repository: stephen-taipei/stephen.taipei
          event-type: submodule-updated
          client-payload: |
            {
              "submodule": ${{ toJSON(github.repository) }},
              "ref": ${{ toJSON(github.ref) }},
              "sha": ${{ toJSON(github.sha) }},
              "message": ${{ toJSON(github.event.head_commit.message || '') }}
            }

      - name: Log notification
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          BRANCH_REF: ${{ github.ref }}
        run: |
          printf 'Notified stephen.taipei about update in %s\n' "$REPOSITORY"
          printf 'Commit: %s\nBranch: %s\n' "$COMMIT_SHA" "$BRANCH_REF"
