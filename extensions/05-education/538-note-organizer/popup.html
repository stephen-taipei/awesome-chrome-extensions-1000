<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Note Organizer</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Note Organizer</h1>

    <div class="section">
      <div class="add-row">
        <input type="text" id="folderInput" placeholder="New folder name">
        <button id="addFolderBtn" class="btn icon">+</button>
      </div>
    </div>

    <div class="section">
      <h2>Folders</h2>
      <div id="foldersList" class="folders-list">
        <p class="empty-message">No folders created</p>
      </div>
    </div>

    <div id="notesSection" class="section" style="display: none;">
      <div class="folder-header">
        <button id="backBtn" class="back-btn">&larr;</button>
        <span id="currentFolderName">Folder</span>
      </div>

      <div class="add-note-form">
        <input type="text" id="noteTitle" placeholder="Note title">
        <textarea id="noteContent" placeholder="Note content"></textarea>
        <button id="addNoteBtn" class="btn primary">Add Note</button>
      </div>

      <div id="notesList" class="notes-list">
        <p class="empty-message">No notes in this folder</p>
      </div>
    </div>

    <div class="search-section">
      <input type="text" id="searchInput" placeholder="Search all notes...">
      <div id="searchResults" class="search-results"></div>
    </div>

    <div class="stats">
      <span id="folderCount">0</span> folders,
      <span id="noteCount">0</span> notes
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
