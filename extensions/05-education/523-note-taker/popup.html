<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Note Taker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Note Taker</h1>

    <div class="section">
      <input type="text" id="noteTitle" placeholder="Note title (optional)">
      <textarea id="noteContent" placeholder="Write your note here..."></textarea>
      <div class="tags-input">
        <input type="text" id="tagInput" placeholder="Add tags (press Enter)">
        <div id="tagsList" class="tags-list"></div>
      </div>
      <button id="saveNoteBtn" class="btn primary">Save Note</button>
    </div>

    <div class="section">
      <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search notes...">
      </div>
    </div>

    <div class="section">
      <h2>Recent Notes</h2>
      <div id="notesList" class="notes-list">
        <p class="empty-message">No notes yet</p>
      </div>
    </div>

    <div class="stats">
      <span id="noteCount">0</span> notes saved
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
