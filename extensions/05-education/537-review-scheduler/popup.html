<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Review Scheduler</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Review Scheduler</h1>

    <div class="due-today">
      <span id="dueCount" class="due-count">0</span>
      <span class="due-label">items due for review</span>
    </div>

    <div class="section">
      <h2>Add Topic to Review</h2>
      <input type="text" id="topicInput" placeholder="Topic name">
      <input type="text" id="notesInput" placeholder="Notes (optional)">
      <button id="addTopicBtn" class="btn primary">Add Topic</button>
    </div>

    <div class="section">
      <h2>Due for Review</h2>
      <div id="dueList" class="topics-list">
        <p class="empty-message">No topics due today</p>
      </div>
    </div>

    <div class="section">
      <h2>Upcoming Reviews</h2>
      <div id="upcomingList" class="topics-list">
        <p class="empty-message">No upcoming reviews</p>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat">
        <span class="stat-value" id="totalTopics">0</span>
        <span class="stat-label">Topics</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="reviewedToday">0</span>
        <span class="stat-label">Reviewed</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="avgInterval">0</span>
        <span class="stat-label">Avg Days</span>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
