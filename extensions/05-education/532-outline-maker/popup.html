<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Outline Maker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Outline Maker</h1>

    <div class="section">
      <input type="text" id="outlineTitle" placeholder="Outline title">
      <button id="extractHeadingsBtn" class="btn secondary">Extract Page Headings</button>
    </div>

    <div class="section">
      <h2>Add Item</h2>
      <div class="add-item-row">
        <select id="itemLevel">
          <option value="1">Level 1</option>
          <option value="2">Level 2</option>
          <option value="3">Level 3</option>
        </select>
        <input type="text" id="itemText" placeholder="Outline item">
        <button id="addItemBtn" class="btn icon">+</button>
      </div>
    </div>

    <div class="section">
      <h2>Outline</h2>
      <div id="outlineContent" class="outline-content">
        <p class="empty-message">Start building your outline</p>
      </div>
    </div>

    <div class="actions">
      <button id="copyBtn" class="btn secondary" disabled>Copy</button>
      <button id="saveBtn" class="btn primary" disabled>Save</button>
      <button id="clearBtn" class="btn secondary">Clear</button>
    </div>

    <div class="section">
      <h2>Saved Outlines</h2>
      <div id="savedOutlines" class="saved-list">
        <p class="empty-message">No saved outlines</p>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
