<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Generator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Quiz Generator</h1>

    <div class="tabs">
      <button class="tab-btn active" data-tab="create">Create</button>
      <button class="tab-btn" data-tab="quiz">Take Quiz</button>
      <button class="tab-btn" data-tab="history">History</button>
    </div>

    <div id="createTab" class="tab-content active">
      <div class="section">
        <input type="text" id="quizName" placeholder="Quiz name">
      </div>
      <div class="section">
        <h2>Add Question</h2>
        <textarea id="questionText" placeholder="Question"></textarea>
        <input type="text" id="optionA" placeholder="Option A">
        <input type="text" id="optionB" placeholder="Option B">
        <input type="text" id="optionC" placeholder="Option C">
        <input type="text" id="optionD" placeholder="Option D">
        <select id="correctAnswer">
          <option value="">Select correct answer</option>
          <option value="A">A</option>
          <option value="B">B</option>
          <option value="C">C</option>
          <option value="D">D</option>
        </select>
        <button id="addQuestionBtn" class="btn secondary">Add Question</button>
      </div>
      <div class="section">
        <div id="questionsList" class="questions-list">
          <p class="empty-message">No questions added</p>
        </div>
        <button id="saveQuizBtn" class="btn primary" disabled>Save Quiz</button>
      </div>
    </div>

    <div id="quizTab" class="tab-content">
      <div class="section">
        <select id="selectQuiz">
          <option value="">Select a quiz</option>
        </select>
        <button id="startQuizBtn" class="btn primary">Start Quiz</button>
      </div>
      <div id="quizArea" class="quiz-area" style="display: none;">
        <div class="question-header">
          <span id="questionNumber">Question 1/5</span>
        </div>
        <div id="currentQuestion" class="current-question"></div>
        <div id="optionsArea" class="options-area"></div>
        <button id="nextQuestionBtn" class="btn primary" disabled>Next</button>
      </div>
      <div id="resultsArea" class="results-area" style="display: none;">
        <h2>Quiz Complete!</h2>
        <div class="score-display">
          <span id="finalScore">0</span>/<span id="totalQuestions">0</span>
        </div>
        <p id="scorePercent">0%</p>
        <button id="retakeBtn" class="btn secondary">Retake Quiz</button>
      </div>
    </div>

    <div id="historyTab" class="tab-content">
      <div id="historyList" class="history-list">
        <p class="empty-message">No quiz history</p>
      </div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
