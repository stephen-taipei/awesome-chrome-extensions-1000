<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Definition Finder</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Definition Finder</h1>

    <div class="section">
      <button id="captureTermBtn" class="btn primary">Capture Selected Term</button>
    </div>

    <div id="termCapture" class="term-capture" style="display: none;">
      <div class="captured-term">
        <span class="term-label">Term:</span>
        <span id="capturedTerm" class="term-text"></span>
      </div>
      <textarea id="definitionInput" placeholder="Enter definition..."></textarea>
      <select id="categorySelect">
        <option value="">Select category</option>
        <option value="science">Science</option>
        <option value="math">Mathematics</option>
        <option value="language">Language</option>
        <option value="history">History</option>
        <option value="technology">Technology</option>
        <option value="other">Other</option>
      </select>
      <button id="saveTermBtn" class="btn primary">Save Definition</button>
    </div>

    <div class="section">
      <h2>Vocabulary List</h2>
      <div class="filter-row">
        <input type="text" id="searchTerms" placeholder="Search terms...">
        <select id="filterCategory">
          <option value="">All Categories</option>
          <option value="science">Science</option>
          <option value="math">Mathematics</option>
          <option value="language">Language</option>
          <option value="history">History</option>
          <option value="technology">Technology</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div id="termsList" class="terms-list">
        <p class="empty-message">No terms saved yet</p>
      </div>
    </div>

    <div class="stats">
      <span id="termCount">0</span> terms in vocabulary
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
