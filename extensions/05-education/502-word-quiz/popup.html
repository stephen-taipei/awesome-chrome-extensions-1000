<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Quiz</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>Word Quiz</h1>
      <p class="subtitle">Test Your Vocabulary</p>
    </header>

    <div class="score-display">
      <div class="score-item">
        <span class="score-value" id="currentScore">0</span>
        <span class="score-label">Score</span>
      </div>
      <div class="score-item">
        <span class="score-value" id="streak">0</span>
        <span class="score-label">Streak</span>
      </div>
      <div class="score-item">
        <span class="score-value" id="highScore">0</span>
        <span class="score-label">Best</span>
      </div>
    </div>

    <div id="startView">
      <div class="difficulty-select">
        <label>Select Difficulty</label>
        <div class="difficulty-options">
          <button class="diff-btn active" data-level="easy">Easy</button>
          <button class="diff-btn" data-level="medium">Medium</button>
          <button class="diff-btn" data-level="hard">Hard</button>
        </div>
      </div>
      <button class="btn btn-primary btn-large" id="startQuiz">Start Quiz</button>
    </div>

    <div id="quizView" style="display: none;">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="question-counter">
        Question <span id="questionNum">1</span> of <span id="totalQuestions">10</span>
      </div>

      <div class="question-card">
        <div class="question-word" id="questionWord">Word</div>
        <div class="question-prompt">What does this word mean?</div>
      </div>

      <div class="options" id="options">
        <button class="option-btn" data-index="0"></button>
        <button class="option-btn" data-index="1"></button>
        <button class="option-btn" data-index="2"></button>
        <button class="option-btn" data-index="3"></button>
      </div>

      <div class="feedback" id="feedback" style="display: none;">
        <span class="feedback-icon" id="feedbackIcon"></span>
        <span class="feedback-text" id="feedbackText"></span>
      </div>

      <button class="btn btn-primary" id="nextQuestion" style="display: none;">Next Question</button>
    </div>

    <div id="resultView" style="display: none;">
      <div class="result-card">
        <div class="result-icon" id="resultIcon">🏆</div>
        <div class="result-title" id="resultTitle">Great Job!</div>
        <div class="result-score">
          <span id="finalScore">8</span>/<span id="finalTotal">10</span>
        </div>
        <div class="result-message" id="resultMessage">You got 80% correct!</div>
      </div>
      <div class="result-actions">
        <button class="btn btn-primary" id="playAgain">Play Again</button>
        <button class="btn btn-secondary" id="backToMenu">Main Menu</button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
