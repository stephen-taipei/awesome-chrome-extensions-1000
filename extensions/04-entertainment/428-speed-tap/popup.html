<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Speed Tap</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <div class="container">
    <header><h1>Speed Tap</h1><div class="header-sub">Tap as fast as you can!</div></header>
    <div class="content">
      <div class="stats">Best: <span id="best">0</span> taps</div>
      <div class="timer">Time: <span id="time">10</span>s</div>
      <div class="score">Taps: <span id="taps">0</span></div>
      <button id="tapBtn" class="tap-btn">TAP!</button>
      <button id="startBtn">START GAME</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
