<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Word Connect</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <div class="container">
    <header><h1>Word Connect</h1><div class="header-sub">Connect letters to make words!</div></header>
    <div class="content">
      <div class="stats">Found: <span id="found">0</span>/<span id="total">0</span> | Score: <span id="score">0</span></div>
      <div id="words" class="words"></div>
      <div id="current" class="current"></div>
      <div id="letters" class="letters"></div>
      <button id="newBtn">NEW PUZZLE</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
