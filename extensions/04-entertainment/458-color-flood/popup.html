<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Color Flood</h1>
    <div class="stats">
      <span>Moves: <span id="moves">0</span>/<span id="maxMoves">25</span></span>
      <span>Wins: <span id="wins">0</span></span>

  <script src="popup.js"></script>
</body>
</html>
