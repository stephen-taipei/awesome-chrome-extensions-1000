<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shape Stack</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Shape Stack</h1>
    <div class="stats">
      <span>Height: <span id="score">0</span></span>
      <span>Best: <span id="highScore">0</span></span>
    </div>
    <div id="gameArea">
      <div id="movingShape"></div>
      <div id="tower"></div>
    </div>
    <button id="dropBtn">Drop Shape</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
