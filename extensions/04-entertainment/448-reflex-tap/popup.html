<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Reflex Tap</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <div class="container">
    <header><h1>👆 Reflex Tap</h1><div class="header-sub">Tap the targets!</div></header>
    <div class="content">
      <div class="stats">Score: <span id="score">0</span> | Best: <span id="best">0</span></div>
      <div id="arena" class="arena"></div>
      <div class="info">Time: <span id="timer">30</span>s | Avg: <span id="avg">-</span>ms</div>
      <button id="startBtn">START</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
