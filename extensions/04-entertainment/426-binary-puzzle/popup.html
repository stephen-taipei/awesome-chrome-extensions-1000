<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Binary Puzzle</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <div class="container">
    <header><h1>Binary Puzzle</h1><div class="header-sub">No more than 2 same in a row!</div></header>
    <div class="content">
      <div class="stats">Level: <span id="level">1</span> | Solved: <span id="solved">0</span></div>
      <div id="grid" class="grid"></div>
      <div id="message" class="message"></div>
      <button id="checkBtn">CHECK</button>
      <button id="newBtn">NEW PUZZLE</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
