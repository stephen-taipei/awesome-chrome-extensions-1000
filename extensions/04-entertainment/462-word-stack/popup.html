<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Word Stack</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="game-container">
    <h1>Word Stack</h1>
    <div class="stats"><span>Score: <span id="score">0</span></span><span>Best: <span id="best">0</span></span></div>
    <div id="targetWord" class="target"></div>
    <div id="stack" class="stack"></div>
    <div id="letters" class="letters"></div>
    <button id="clearBtn">Clear Stack</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
