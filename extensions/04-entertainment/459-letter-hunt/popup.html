<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Letter Hunt</h1>
    <div class="stats">
      <span>Score: <span id="score">0</span></span>
      <span>Best: <span id="best">0</span></span>
    </div>
    <div id="target">Find: <span id="targetLetter">A</span></div>
    <div id="grid"></div>
    <p id="message">Find all target letters!</p>
    <button id="newGame">New Game</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
