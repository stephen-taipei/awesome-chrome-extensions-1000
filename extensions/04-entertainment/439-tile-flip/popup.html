<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Tile Flip</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <div class="container">
    <header><h1>🎴 Tile Flip</h1><div class="header-sub">Match the pattern!</div></header>
    <div class="content">
      <div class="stats">Score: <span id="score">0</span> | Level: <span id="level">1</span></div>
      <div class="boards">
        <div class="board-section"><div class="label">Target</div><div id="target" class="board small"></div></div>
        <div class="board-section"><div class="label">Your Board</div><div id="player" class="board"></div></div>
      </div>
      <button id="checkBtn">CHECK</button>
      <div id="feedback" class="feedback"></div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
