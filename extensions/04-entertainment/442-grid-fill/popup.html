<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Grid Fill</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <div class="container">
    <header><h1>♞ Grid Fill</h1><div class="header-sub">Knight's tour puzzle!</div></header>
    <div class="content">
      <div class="stats">Score: <span id="score">0</span> | Filled: <span id="filled">1</span>/25</div>
      <div id="grid" class="grid"></div>
      <button id="resetBtn">RESET</button>
      <div id="feedback" class="feedback"></div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
