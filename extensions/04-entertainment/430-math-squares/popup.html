<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Math Squares</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <div class="container">
    <header><h1>Math Squares</h1><div class="header-sub">Fill in the missing numbers!</div></header>

  </div>
  <script src="popup.js"></script>
</body>
</html>
