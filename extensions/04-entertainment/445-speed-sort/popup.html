<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Speed Sort</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <div class="container">
    <header><h1>⚡ Speed Sort</h1><div class="header-sub">Sort in order!</div></header>
    <div class="content">
      <div class="stats">Best: <span id="best">-</span>s | Time: <span id="timer">0.0</span>s</div>
      <div class="instruction">Tap items in <span id="orderType">ascending</span> order!</div>
      <div id="items" class="items"></div>
      <div id="sorted" class="sorted"></div>
      <div id="feedback" class="feedback"></div>
      <button id="newBtn">NEW GAME</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
