<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Arrow Maze</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <div class="container">
    <header><h1>➡️ Arrow Maze</h1><div class="header-sub">Follow the arrows!</div></header>
    <div class="content">
      <div class="stats">Score: <span id="score">0</span> | Level: <span id="level">1</span></div>
      <div id="grid" class="grid"></div>
      <div class="controls">
        <button class="dir-btn" data-dir="up">↑</button>
        <div class="lr">
          <button class="dir-btn" data-dir="left">←</button>
          <button class="dir-btn" data-dir="right">→</button>
        </div>
        <button class="dir-btn" data-dir="down">↓</button>
      </div>
      <div id="feedback" class="feedback"></div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
