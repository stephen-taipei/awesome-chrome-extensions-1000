<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Letter Drop</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <div class="container">
    <header><h1>Letter Drop</h1><div class="header-sub">Catch letters to spell the word!</div></header>
    <div class="content">
      <div class="stats">Score: <span id="score">0</span> | Lives: <span id="lives">3</span></div>
      <div class="target">Spell: <span id="word" class="word"></span></div>
      <div id="collected" class="collected"></div>
      <div id="game" class="game"></div>
      <button id="startBtn">START</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
