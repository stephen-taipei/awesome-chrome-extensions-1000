<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Math Chain</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <div class="container">
    <header><h1>Math Chain</h1><div class="header-sub">Reach the target number!</div></header>
    <div class="content">
      <div class="stats">Score: <span id="score">0</span> | Level: <span id="level">1</span></div>
      <div class="target">Target: <span id="target" class="target-num"></span></div>
      <div id="chain" class="chain"></div>
      <div id="ops" class="ops"></div>
      <div id="message" class="message"></div>
      <button id="newBtn">NEW PUZZLE</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
