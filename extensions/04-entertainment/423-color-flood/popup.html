<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Color Flood</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <div class="container">
    <header><h1>Color Flood</h1><div class="header-sub">Fill the board with one color!</div></header>
    <div class="content">
      <div class="stats">Moves: <span id="moves">0</span>/25 | Wins: <span id="wins">0</span></div>
      <div id="grid" class="grid"></div>
      <div id="colors" class="colors"></div>
      <div id="message" class="message"></div>
      <button id="newBtn">NEW GAME</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
