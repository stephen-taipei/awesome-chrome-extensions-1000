<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Math Grid</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <div class="container">
    <header><h1>Math Grid</h1><div class="header-sub">Fill in the missing number!</div></header>
    <div class="content">
      <div class="stats">Score: <span id="score">0</span> | Streak: <span id="streak">0</span></div>
      <div id="grid" class="grid"></div>
      <div id="options" class="options"></div>
      <div id="message" class="message"></div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
