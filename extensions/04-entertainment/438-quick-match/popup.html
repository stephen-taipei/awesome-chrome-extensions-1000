<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Quick Match</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <div class="container">
    <header><h1>⚡ Quick Match</h1><div class="header-sub">Match pairs fast!</div></header>
    <div class="content">
      <div class="stats">Score: <span id="score">0</span> | Pairs: <span id="pairs">0</span>/8</div>
      <div class="timer-bar"><div id="timerFill" class="timer-fill"></div></div>
      <div id="grid" class="grid"></div>
      <div id="feedback" class="feedback"></div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
