<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Symbol Match</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <div class="container">
    <header><h1>Symbol Match</h1><div class="header-sub">Swap to match 3+!</div></header>
    <div class="content">
      <div class="stats">Score: <span id="score">0</span> | Moves: <span id="moves">20</span></div>
      <div id="grid" class="grid"></div>
      <div id="message" class="message"></div>
      <button id="newBtn">NEW GAME</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
