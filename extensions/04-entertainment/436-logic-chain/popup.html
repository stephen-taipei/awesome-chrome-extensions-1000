<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Logic Chain</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <div class="container">
    <header><h1>🔗 Logic Chain</h1><div class="header-sub">Find the next in sequence!</div></header>
    <div class="content">
      <div class="stats">Score: <span id="score">0</span> | Level: <span id="level">1</span></div>
      <div id="sequence" class="sequence"></div>
      <div class="question">What comes next?</div>
      <div id="options" class="options"></div>
      <div id="feedback" class="feedback"></div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
