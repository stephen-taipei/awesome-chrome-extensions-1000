<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Emoji Decoder</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <div class="container">
    <header><h1>🎭 Emoji Decoder</h1><div class="header-sub">Guess the phrase!</div></header>
    <div class="content">
      <div class="stats">Score: <span id="score">0</span> | Streak: <span id="streak">0</span></div>
      <div id="emoji" class="emoji"></div>
      <input type="text" id="input" placeholder="Type your guess...">
      <button id="submitBtn">GUESS</button>
      <button id="skipBtn">SKIP</button>
      <div id="feedback" class="feedback"></div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
