<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tap Sequence</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="game-container">
    <h1>Tap Sequence</h1>
    <div class="stats"><span>Level: <span id="level">1</span></span><span>Best: <span id="best">0</span></span></div>
    <div class="mode-select">
      <button class="mode active" data-mode="numbers">Numbers</button>
      <button class="mode" data-mode="letters">Letters</button>
    </div>
    <div id="grid" class="grid"></div>
    <div id="message" class="message"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
