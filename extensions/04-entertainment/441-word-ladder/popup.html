<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Word Ladder</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <div class="container">
    <header><h1>🪜 Word Ladder</h1><div class="header-sub">One letter at a time!</div></header>
    <div class="content">
      <div class="stats">Score: <span id="score">0</span> | Moves: <span id="moves">0</span></div>
      <div class="words">
        <div class="word start" id="startWord"></div>
        <div class="arrow">↓</div>
        <div class="word current" id="currentWord"></div>
        <div class="arrow">↓</div>
        <div class="word target" id="targetWord"></div>
      </div>
      <input type="text" id="input" maxlength="4" placeholder="Type next word">
      <button id="submitBtn">SUBMIT</button>
      <div id="feedback" class="feedback"></div>
      <div id="history" class="history"></div>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
