<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>網站已封鎖</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);
      color: #7f1d1d;
    }

    .container {
      text-align: center;
      padding: 40px;
      max-width: 500px;
    }

    .icon {
      font-size: 80px;
      margin-bottom: 24px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 12px;
      color: #991b1b;
    }

    .site-name {
      font-size: 18px;
      color: #b91c1c;
      background: rgba(220, 38, 38, 0.1);
      padding: 8px 20px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 24px;
    }

    p {
      font-size: 16px;
      line-height: 1.6;
      color: #991b1b;
      margin-bottom: 32px;
    }

    .quote {
      font-style: italic;
      font-size: 14px;
      color: #b91c1c;
      padding: 16px 24px;
      background: white;
      border-radius: 12px;
      border-left: 4px solid #dc2626;
    }

    .back-btn {
      margin-top: 32px;
      padding: 12px 32px;
      border: none;
      border-radius: 10px;
      background: #dc2626;
      color: white;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .back-btn:hover {
      background: #b91c1c;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">🚫</div>
    <h1>此網站已被封鎖</h1>
    <div class="site-name" id="siteName"></div>
    <p>你設定了封鎖此網站以保持專注。<br>回到工作或學習上吧！</p>
    <div class="quote">
      "專注是成功的關鍵。每一次的自律都讓你更接近目標。"
    </div>
    <button class="back-btn" id="backButton">返回上一頁</button>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
